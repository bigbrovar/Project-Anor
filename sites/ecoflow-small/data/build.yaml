# This kit: the parts used, the page text, the three energy-flow views and
# the check settings. Products are described in products.yaml; positions on
# the drawing live in layout.yaml.

version: "0.99"
updated: 2026-11-22   # shown in the footer, with the version

# Text at the top of the page and in the "Why this design" section.
# Text fields can use <b> for bold.
page:
  host: small.anor.openculture.org.ng   # the site's address, with no https:// and no slash
  title: Solar Planner · Small plug-in kit, one EcoFlow and one panel
  description: A plug-in kit with more power at once. One EcoFlow DELTA 3 Classic power station and one Jinko 650 W panel, for lights, a fan, a TV, a laptop, phones and short use of a blender.
  brand: small kit
  eyebrow: Small · plug-in kit · EcoFlow DELTA 3 Classic
  h1: More power at once, still one box
  lead: A plug-in kit with nothing to wire. One EcoFlow DELTA 3 Classic holds a 1.8 kW inverter, the battery and the solar charger. One Jinko 650 W panel charges it through a single cable. It runs lights, a fan, a TV, a laptop and phones, and carries a blender or another heavy load for a few minutes.
  inverters_label: Output
  glance:
    - {icon: pv, cat: solar, title: One panel, text: "One Jinko 650 W panel, about 52 V on a cold morning, inside the unit’s 60 V limit. The unit takes up to 500 W from it."}
    - {icon: inverter, cat: batt, title: One box, text: "The EcoFlow DELTA 3 Classic is a 1.8 kW inverter, a 1.0 kWh LiFePO4 battery and the solar charger together."}
    - {icon: home, cat: load, title: Plug-in loads, text: "Appliances plug straight into its sockets. Plan on 1,440 W at once and about 1.2 kWh a day."}
  budget:
    eyebrow: What it runs
    title: About 0.7 kW on at once, 1.2 kWh a day
    lead: "The unit gives 1.8 kW, but plan on 1,440 W. The hours are a typical day; wattages are typical figures, so check your own appliances’ labels. The battery holds under 1 kWh, so what runs after sunset matters most."
    budget_w: 1440
    light_kwh: 0
    sun_hours: 4
    derate: 0.7
    rows:
      - {load: LED bulb, watts: 10, qty: 6, hours: 4}
      - {load: Standing fan, watts: 50, qty: 1, hours: 6}
      - {load: "LED TV, 43 inch", watts: 80, qty: 1, hours: 4}
      - {load: Wi-Fi router, watts: 12, qty: 1, hours: 6}
      - {load: Laptop, watts: 65, qty: 1, hours: 3}
      - {load: Phone charging, watts: 10, qty: 2, hours: 2}
      - {load: Blender, watts: 400, qty: 1, hours: 0.1, note: A few minutes at a time.}
      - {load: Fridge, watts: 150, qty: 0, hours: 0, note: "Only if little else runs at night. A fridge uses about 1.2 kWh a day, close to all this kit makes.", status: part}
      - {load: "Pressing iron, kettle or microwave", watts: 1200, qty: 0, hours: 0, note: "The unit can carry one, but ten minutes uses a fifth of the battery. Keep them on the grid.", status: part}
      - {load: Air conditioner, watts: 900, qty: 0, hours: 0, note: Not on this kit., status: "no"}
    settings:
      - "<b>Charge from the panel first.</b> Plug into a wall socket only when the battery is low and there is no sun."
      - "<b>Keep the unit indoors</b>, in the shade and off the floor. Only the panel goes outside."
      - "<b>Switch off the AC sockets</b> when nothing is plugged in. The unit uses power just keeping them on."
      - "If the EcoFlow app offers a <b>discharge limit</b>, set it to 20%. That is the range this guide sizes the battery for."
  upgrades:
    - "<b>For a fridge or fans through the night</b>, move up to <a href=\"https://msmall.anor.openculture.org.ng\">Medium small</a>: 24 V, 3.3 kW and a 5.1 kWh battery. The same panel is used there, so it carries over."
    - "This unit’s battery cannot be added to, and it takes one panel only."
  notes:
    title: Why this design
    lead: For a small flat or shop that wants the same basics as the Tiny kit, with room to run one heavier appliance for a short time.
    items:
      - {h: What it runs, text: "LED bulbs, a standing fan, a TV, Wi-Fi, a laptop and phones, plus a blender for a few minutes. Its battery is about the same size as the Tiny kit’s, so it does not run longer, only harder."}
      - {h: Why a power station, text: "The inverter, battery, charger and protection come as one tested unit. There are no battery cables, breakers or boards to get wrong."}
      - {h: Why one 650 W panel, text: "The unit takes at most 500 W, and a 650 W panel reaches that earlier in the day and holds it for longer than a smaller one. It is also the panel every larger design here uses."}
      - {h: Why 60 V matters, text: "The unit’s solar input stops at 60 V. This panel reaches about 52 V on a 10 °C morning. A second panel in series would pass the limit and damage the unit."}
    alt_title: Alternatives
    alternatives:
      - {name: "Bluetti AC180, 1.8 kW, 1,152 Wh", url: "https://www.bluettipower.com/", text: "Does the same job with the same panel: its solar input is 12 to 60 V, 10 A and 500 W. No price is given here. Nigerian listings ran from about ₦800,000 to over ₦1,700,000 on the day they were checked, with no official store, which is too inconsistent to list. Check current prices and do your own research."}
      - {name: "EcoFlow DELTA 3 1000 Air, 500 W, 960 Wh", url: "https://tiny.anor.openculture.org.ng", text: "The Tiny kit. About the same battery for less money, if 400 W at once is enough."}
  footer:
    - "The EcoFlow and Fouani links are not affiliate links."
    - "Prices and stock change. Check both before buying."

