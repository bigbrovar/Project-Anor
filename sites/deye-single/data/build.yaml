other_blocks:
  grid:
    title: Grid supply
    icon: meter
    category: grid
    about: Single-phase utility supply through the kWh meter. Feeds the Deye grid port only; every load sits behind the Deye.
    rows:
      - [Supply, Single phase]
      - [Feeds, Deye grid port]
  light:
    title: Light loads
    icon: home
    category: load
    about: "On the Deye backup (LOAD) output, so they stay on in an outage: TV, refrigerator, ceiling fans, lights, network switch, routers, power tools, blender and laptops."
    rows:
      - [Supplied by, Deye LOAD output]
      - [In an outage, Stay on]
  heavy:
    title: Heavy loads
    icon: home
    category: load
    about: "On the Deye GEN port, set as a smart load output: up to two air conditioners, the deep-well pump and an induction cooker, within about 5 kW. The oven and water heaters are for grid time. See the heavy-load budget."
    rows:
      - [Supplied by, Deye GEN port (smart load)]
      - [Grid on, Always on]
      - [Grid off, "On above 90% battery with sun, off at 50%"]

modes:
  day:
    caption: <b>Sunny day.</b> The three strings feed the Deye’s trackers. It runs the light loads, charges the batteries and, once the battery is above the smart-load level, the heavy loads on the GEN port too.
    flowing: [w-pva, w-pvb, w-pvc, w-boxa, w-boxb, w-boxc, w-deyedc, w-brk, w-batp, w-batn, w-lightout, w-light, w-genout, w-heavy]
    reversed: []
  night:
    caption: <b>Night, grid off.</b> No solar. The Deye runs the light loads from the 29.4 kWh bank. The heavy loads stay on until the battery reaches the smart-load off level, then go off to save the rest for the light loads.
    flowing: [w-deyedc, w-brk, w-batp, w-batn, w-lightout, w-light, w-genout, w-heavy]
    reversed: [w-deyedc, w-brk, w-batp, w-batn]
  grid:
    caption: <b>Grid on.</b> Grid passes through the Deye to both the light and the heavy loads, and can recharge the bank, depending on its settings.
    flowing: [w-grid, w-gridin, w-lightout, w-light, w-genout, w-heavy, w-deyedc, w-brk, w-batp, w-batn]
    reversed: []

checks:
  battery: bat
  inverters: [deye]
  chargers: [deye]
  charger_breakers:
    brk-deye: deye
  low_battery_v: 48
  inverter_efficiency: 0.94
