# Where everything sits on the schematic. You only need this file to add, move
# or re-route something on the drawing; specs and parts live in the other files.
#
#   at      for a block: [x, y, width, height], measured from the top-left corner
#   style   tile (picture on top, the default), side (icon on the left) or stack
#   path    an SVG path for a wire. "M115 230 V280" starts at x=115, y=230 and runs
#           down to y=280. H runs sideways to an x, V up or down to a y.

canvas: [1400, 1320]

blocks:
  - id: pv-a
    part: pv-a
    short: PV 1
    at: [30, 30, 240, 200]
    title: PV 1 · 3.9 kWp
    subtitle: 6 × Jinko 650 W
    icon: pv
    photo_height: 120
    panels: {count: 6, cols: 3, size: 30}
  - id: pv-b
    part: pv-b
    short: PV 2
    at: [290, 30, 240, 200]
    title: PV 2 · 3.25 kWp
    subtitle: 5 × Jinko 650 W
    icon: pv
    photo_height: 120
    panels: {count: 5, cols: 3, size: 30}
  - id: pv-c
    part: pv-c
    short: PV 3
    at: [550, 30, 240, 200]
    title: PV 3 · 3.25 kWp
    subtitle: 5 × Jinko 650 W
    icon: pv
    photo_height: 120
    panels: {count: 5, cols: 3, size: 30}
  - id: box-1
    part: box-1
    short: PV box
    at: [30, 280, 760, 84]
    title: PV box
    subtitle: 3 in 3 out · fuses, breaker and SPD on each channel
