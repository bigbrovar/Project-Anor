    style: side
    opens: pv-box-1
  - id: deye
    part: deye
    short: Deye 8K
    at: [30, 420, 760, 300]
    title: Deye SUN-8K-SG06LP1-EU-CM3
    subtitle: 8 kW · 48 V battery · 3 MPPT, up to 500 V
    icon: inverter
    photo_height: 170
    ports: [[solar, PV 1-3], [grid, GRID], [batt, BAT], [load, LOAD], [load, GEN]]
  - id: brk-deye
    part: brk-deye
    short: Deye breaker
    at: [330, 790, 160, 120]
    title: BENY 250 A
    subtitle: Deye battery
    icon: mccb
    style: stack
  - id: busbar
    part: busbar
    at: [30, 960, 760, 70]
    title: Battery busbar
    subtitle: Copper bars joining the inverter to the batteries
    icon: busbar
    style: side
  - id: bat
    part: bat
    short: Battery bank
    at: [30, 1080, 760, 210]
    title: Battery bank · 29.4 kWh
    subtitle: 2 × Deriy 14.7 kWh LiFePO4, stacked · 16S · JK BMS 200 A
    icon: battery
    photo_height: 130
    packs: 2
  - id: grid
    at: [1030, 30, 340, 84]
    title: Grid supply
    subtitle: Single phase · kWh meter
    icon: meter
    style: side
  - id: gridbd
    part: gridbd
    at: [1030, 150, 340, 84]
    title: Grid board
    subtitle: 2P MCB · T2 SPD · CT clamp
    icon: db
    category: grid
    style: side
  - id: acb-light
    part: acb-light
    at: [1030, 300, 340, 84]
    title: Light-load board
    subtitle: Chint MCB · T2 SPD · RCBO
    icon: db
    style: side
  - id: light
    at: [1030, 420, 340, 200]
    title: Light loads
    subtitle: On the Deye LOAD output
    icon: home
    photo_height: 120
    loads: [lightbulb, fan, tv, refrigerator, router, laptop]
  - id: acb-heavy
    part: acb-heavy
    at: [1030, 700, 340, 84]
    title: Heavy-load board
    subtitle: On the GEN port · smart load
    icon: db
    style: side
  - id: heavy
    at: [1030, 820, 340, 200]
    title: Heavy loads
    subtitle: About 5 kW budget · see below
    icon: home
    photo_height: 120
    loads: [air-vent, droplets, flame, microwave, thermometer]

