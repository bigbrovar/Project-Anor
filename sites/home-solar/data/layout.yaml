  - {id: w-combc, from: comb-c, to: mppt-c, type: solar, path: M557 364 V410, size: 25 mm², length: 2 ft}
  - {id: w-pvd, from: pv-d, to: comb-d, type: solar, path: M852 230 V280, size: "10 mm², UV-rated, shielded", length: about 18 m}
