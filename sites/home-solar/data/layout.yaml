# Wires between blocks. type: solar, batt, grid or load (power), none (earth)
# or data. Earth wires draw an earth symbol at earth_at.
# Optional on power wires: size (cable cross-section, e.g. 50 mm²) and length.
# Both show when someone hovers the wire or opens a block it connects to.
wires:
  - {id: w-pva, from: pv-a, to: comb-ab, type: solar, path: M115 230 V280, size: "10 mm², UV-rated, shielded", length: about 18 m}
  - {id: w-pvb, from: pv-b, to: comb-ab, type: solar, path: M300 230 V280, size: "10 mm², UV-rated, shielded", length: about 18 m}
  - {id: w-combrs, from: comb-ab, to: rs, type: solar, path: M200 364 V410}
