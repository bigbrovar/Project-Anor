# Where everything sits on the schematic. You only need this file to add, move
# or re-route something on the drawing; specs and parts live in the other files.
#
# Positions are in drawing units on a canvas of the size below. They aren't
# pixels: the page scales the whole drawing to fit the screen.
#   at      for a block: [x, y, width, height], measured from the top-left corner
#   style   tile (picture on top, the default), side (icon on the left) or stack
#   path    an SVG path for a wire. "M115 230 V280" starts at x=115, y=230 and runs
#           down to y=280. H runs sideways to an x, V up or down to a y.

canvas: [1400, 1270]   # width, height

blocks:
