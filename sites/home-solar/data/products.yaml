  diy-gx-cm4:
    name: DIY GX on Raspberry Pi CM4
    icon: gx
    about: GX monitoring hub. Collects data from the inverters, chargers and batteries for monitoring, and allows remote control of the system.
    why:
      - "I built it around a Raspberry Pi Compute Module 4 with 4 GB of RAM and a dual isolated CAN HAT. It runs Venus OS for far less than a Cerbo GX, with more processing headroom."
      - "The CM4 has onboard eMMC storage, which holds up to round-the-clock logging better than a microSD card."
      - "It runs Venus OS Large with Node-RED flows that read the JK BMS and the Victron inverters over CAN, shed heavy loads when the battery runs low, and send live data to Home Assistant, InfluxDB and Grafana."
    specs:
      compute: Raspberry Pi CM4
      storage: eMMC
      board: Pi 4 form-factor carrier
      can: "Dual CAN: JK BMS, VE.Can"
      mk3: MK3 to MultiPlus-II
      cable: RJ45
    note: One CAN connection reads the battery management system (BMS). The other links the Multi RS and both solar chargers.

