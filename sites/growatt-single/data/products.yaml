# Every product in the build: panels, inverter, breakers, boards and the parts
# inside the PV boxes. build.yaml and combiners.yaml refer to them by id (the
# name ending in a colon, like jinko-tiger-neo-650).
#
#   name      full product name, shown on cards and in the detail panel
#   short     optional short name, used in the sizing checks
#   icon      pv, inverter, mppt, battery, combiner, fuse, mcb, mccb, spd, busbar,
#             shunt, gx, db, meter, grid or home
#   about     one line on what it does
#   specs     key: value pairs. Each key needs a label in spec_labels below.
#             Use null for a value you don't know yet: it stays hidden on the page
#             and the build lists it, so you can see what's still missing.
#   note, advice   optional extra lines in the detail panel
#   links     datasheet, buy, alternatives and read (blog posts to read more,
#             each with a title and url). Mark affiliate links with
#             affiliate: true so the page labels them.
#   brand     optional id from brands below. Its lines open the product's
#             "Why this one" list in the detail panel
#   why       optional line, or list of lines, on why this product was picked.
#             Put quotes around a line that has a colon in it.

spec_labels:   # spec key: [label shown on the page, unit]
  pmax_w: [Power, W]
  voc_v: [Voc, V]
  isc_a: [Isc, A]
  imp_a: [Imp, A]
  voc_coef_pct: [Voc temp. coeff., "%/°C"]
  max_fuse_a: [Max series fuse, A]
  inverter_va: [Max apparent power, VA]
  cont_w_25c: [Rated output, W]
  peak_w: [Peak for 10 s, W]
  battery_v: [Battery, ""]
  charge_a: [Max charge and discharge, A]
  pv_voc_max_v: ["PV voltage, absolute max", V]
  pv_w_max: [Max PV input power, W]
  mppt_range: [MPPT range, ""]
  trackers: [MPPTs, ""]
  mppt_currents: [MPPT input current, ""]
  pv_op_a: [PV current per string MPPT, A]
  pv_isc_max_a: [PV short-circuit per string MPPT, A]
  ac_in_max_a: [Max AC input current, A]
  parallel: [Parallel, ""]
  comms: [Comms, ""]
  efficiency: [Peak efficiency, ""]
  current_a: [Frame, A]
  trip: [Trip, ""]
  poles: [Poles, ""]
  voltage_vdc: [Voltage, V DC]
  fuse_a: [String fuses, A]
  fuses: [Fuses, ""]
  mcb_2p_a: [2P breaker, A]
  spd_ucpv_v: [SPD voltage, V DC]
  breaker_vdc: [Breaker voltage, V DC]
  spd_v: [Max voltage, V DC]
  kwh: [Energy, kWh]
  cells: [Cells, ""]
  nominal_v: [Nominal, V]
  ah: [Capacity, Ah]
  chem: [Chemistry, ""]
  bms: [BMS, ""]
  bms_a: [BMS current, A]
  rating_a: [Rating, A]
  bars: [Bars, ""]
  main_a: [Main breaker, A]
  spd: [Surge protector, ""]
  deye_in_a: [Breaker to each Deye grid port, A]
  mcb_a: [MCB, A]
  rcbo: [RCBO, ""]
  phase: [Supply, ""]
  meter: [Meter, ""]
  ct: [Export control, ""]
  spd_type: [Class, ""]
  imax: [Max discharge, ""]
  uc_v: [Uc, V AC]
  joins: [Joins, ""]

# Why each maker was picked. A product with `brand: feeo` starts its
# "Why this one" list with these lines, then adds its own `why` lines.

brands:

  growatt:
    why:
      - "Growatt is a tier 2 maker, with very good solar products in the premium-value segment."
      - "Tiers aren’t an official rating; installers use them as shorthand. Tier 2 means a solid mid-range brand: good designs and reasonable support, for less than tier 1."

  deriy:
    why:
      - "Deriy is a solar startup that ships high-quality EVE cells with a JK inverter BMS."
      - "Good value, but after-sales support is limited to Lagos and Abuja."
      - "I’ve tested their battery myself and use it in my own system, so it’s easy to recommend."
      - "<b>Disclosure:</b> I consult for Deriy on technical matters: after-sales repairs, documentation and product improvement. My role has nothing to do with sales or marketing."

  feeo:
    why:
      - "Feeo is a reputable Chinese maker of electrical protection for solar, like DC breakers, fuses and surge protectors. The company is ISO 9001 certified."

  zjbeny:
    why:
      - "ZJBeny is a reputable Chinese maker of DC protection for solar, from breakers and fuses to isolators and surge protectors."

  chint:
    why:
      - "Chint is one of China’s largest makers of low-voltage electrical equipment, founded in 1984 and sold in more than 140 countries and regions."
      - "One maker for the whole board: breakers, RCBOs and surge protectors that fit the same DIN rail."
      - "Chint has authorised dealers in Nigeria, so genuine parts can be bought locally."

products:

  jinko-tiger-neo-650:
    name: Jinko Tiger Neo 3.0 N-type 66QL6, 650 W
    short: Jinko 650 W
    icon: pv
    about: Solar panel. Turns sunlight into DC electricity.
    why:
      - "Jinko Tiger Neo panels use N-type cells, which lose less output in roof heat than older P-type panels."
      - "Certified to IEC 61215 and IEC 61730, and stocked in Nigeria by Fouani."
    specs:
      pmax_w: 650
      voc_v: 50.26
      isc_a: 15.98
      imp_a: 15.27
      voc_coef_pct: -0.24
      max_fuse_a: 35
    note: "Availability varies, so any Jinko Tiger Neo from 590 to 650 W fits these strings. The checks use the 650 W panel; the 590 W has a little more voltage and less current, and stays inside every limit too."
    advice: "Fake and relabelled panels are common. Buy from a distributor listed on the maker’s official website, check the serial number on the label with the maker, compare the label with the official datasheet, and walk away from prices far below other sellers."
    links:
      read:
        - title: "A budget solar inverter system: solar panels"
          url: https://blog.openculture.org.ng/of-a-budget-off-grid-solar/
      datasheet: https://jinkosolar.com/en/site/tigerneo_3
      buy:
        - name: Jinko panels at Fouani
          url: https://fouanistore.com/nigeria-en/search?subcategories=Solar+Panels&page=&brand=Jinko
      alternatives:
        - name: "LONGi, official site"
          url: https://www.longi.com/en/
          note: "Check its official site for distributors in your country. LONGi also has an online checker for module serial numbers."
        - name: "JA Solar, official site"
          url: https://www.jasolar.com/
          note: "Check its official site for distributors in your country."
        - name: "Trina Solar, official site"
          url: https://www.trinasolar.com/
          note: "Check its official site for distributors in your country."
        - name: "Canadian Solar, official site"
          url: https://www.canadiansolar.com/
          note: "Check its official site for distributors in your country."

  growatt-spf6000-es-plus:
    name: Growatt SPF 6000 ES Plus, 6 kW, off-grid, 48 V battery
    short: Growatt SPF 6000
    icon: inverter
    about: Off-grid inverter-charger with two built-in solar trackers. Runs the house from solar and battery, and uses grid as a backup charger and bypass. It doesn’t export to grid.
    brand: growatt
    why:
      - "Well regarded as great value, and very reliable."
      - "A clear upgrade path: a second SPF 6000 in parallel makes it a 12 kW system, and up to 6 can work together."
      - "Two built-in solar trackers taking up to 500 V and 8 kW of panels, so there are no separate solar chargers."
      - "Runs with or without a battery, and talks CAN or RS485 to the battery’s BMS."
      - "Remote monitoring over Wi-Fi, and remote firmware updates."
    specs:
      cont_w_25c: 6000
      inverter_va: 6000
      peak_w: 12000
      battery_v: 48 V
      charge_a: 100
      trackers: 2
      pv_w_max: 8000
      pv_voc_max_v: 500
      mppt_range: 120 to 450 V
      mppt_currents: "16 + 16 A, one string per tracker"
      pv_op_a: 16
      pv_isc_max_a: null
      parallel: Up to 6 units
      comms: "CAN and RS485 to the BMS, Wi-Fi logger"
      efficiency: 93%
    note: "Max charge 100 A from solar and 80 A from grid. The home JK BMS is set to 88 A continuous charge, so set the Growatt’s maximum charge current to 80 A."
    advice: "Fouani lists it as the SPF ES Series 6000ES. The listing shows the ES Plus’s two trackers, 500 V input and 8 kW of PV, but check the unit says ES Plus before you buy."
    links:
      read:
        - title: "Building an off-grid solar system: my approach"
          url: https://blog.openculture.org.ng/solar-plan/
      datasheet: https://en.growatt.com/products/spf-6000-es-plus
      buy:
        - name: Fouani (Nigeria)
          url: https://fouanistore.com/nigeria-en/product/922?growatt-hybrid-inverter-spf-es-series-6kw-48v-6000es
      alternatives:
        - name: "SRNE HESP 6 kW (HESP4860S100-H), at HM Solar"
          url: https://hmsolarltd.com/products/series-hesp/
          note: "Close match: 6 kW, two trackers taking up to 500 V, BMS communication, time-slot charging, and up to 6 in parallel, single or three phase."

  pv-box-2ch:
    name: PV box, 2 separate channels, Feeo parts
    icon: combiner
    about: PV box. Where the panel strings are protected and can be switched off before they reach the inverter.
    brand: feeo
    why: "Built from Feeo parts: gPV fuses to IEC 60269-6, DC breakers to IEC/EN 60947-2 and surge protectors to EN 50539-11 (now IEC/EN 61643-31)."
    specs:
      fuses: 4, on + and − of each string
      fuse_a: 25
      spd_ucpv_v: 600
      mcb_2p_a: null
      breaker_vdc: null
    note: Two separate channels, one per Growatt tracker, built from the same Feeo fuses, 2-pole breakers and 600 V surge protectors as the home system’s combiner.
    links:
      buy:
        - name: Feeo fuse holder on AliExpress
          url: https://s.click.aliexpress.com/e/_c41K6QGX
          affiliate: true

  feeo-fuse-25:
    name: Feeo PV fuse and holder, 25 A
    icon: fuse
    about: PV fuse. Blows to protect a string’s cable if too much current flows back into it.
    brand: feeo
    why: "A gPV fuse, the class made to protect solar strings, built to IEC 60269-6. CE and TÜV certified."
    specs:
      fuse_a: 25
    links:
      buy:
        - name: AliExpress
          url: https://s.click.aliexpress.com/e/_c41K6QGX
          affiliate: true

  feeo-spd-600:
    name: Feeo DC surge protector, 600 V
    icon: spd
    about: Surge protector. Diverts voltage spikes from lightning or switching to earth before they reach the equipment.
    brand: feeo
    why: "Built to EN 50539-11, the standard for surge protectors on the DC side of solar systems, since replaced by IEC/EN 61643-31. TÜV certified."
    specs:
      spd_v: 600

  feeo-mcb-2p:
    name: Feeo DC breaker, 2 pole
    icon: mcb
    about: DC breaker. Switches the string off and trips on overload.
    brand: feeo
    why:
      - "Built to IEC/EN 60947-2, the international standard for low-voltage circuit breakers. CB and TÜV certified."
      - "Feeo’s FPV series breakers are non-polarity, so they break fault current flowing in either direction. That matters on solar and battery circuits."
    specs:
      current_a: null
      voltage_vdc: null

  beny-bdm-250:
    name: ZJBeny DC MCCB, 250 A frame, in enclosure
    icon: mccb
    about: DC moulded-case breaker. Protects the battery cable from overload and short circuit, and isolates the inverter from the batteries.
    brand: zjbeny
    why: "The BDM series is built to IEC 60947-2, the international standard for low-voltage circuit breakers, and China’s GB/T 14048.2. TÜV certified (TUV-027276-E), rated for 500 V DC and IP65 in its enclosure."
    specs:
      current_a: 250
      trip: Adjustable
      poles: 2
      voltage_vdc: 500
    note: The same adjustable 250 A unit as on the home system, set to suit the Growatt.
    links:
      buy:
        - name: ZJBeny store on Alibaba
          url: https://zjbeny.en.alibaba.com/search/product?SearchText=mccb
      alternatives:
        - name: Nanque 2P MCCB, 200 A
          url: https://s.click.aliexpress.com/e/_c3VDGhOR
          affiliate: true
          note: "Nanque is a reputable Chinese maker of DC protection for solar."

  busbar-48v:
    name: Battery busbar pair
    icon: busbar
    about: Busbar. Copper bars where the inverter and the battery connect, with room for a second pack.
    why:
      - "A busbar gives the battery, the inverter and anything added later their own bolted connections, in place of lugs stacked on a battery terminal."
    specs:
      bars: Positive and negative
      rating_a: null

  diy-lfp-14k7:
    name: Deriy EVE LiFePO4 battery, 14.3 kWh
    icon: battery
    about: LiFePO4 battery pack. Stores energy for night and cloudy days. Its BMS protects the cells from overcharge, overdischarge and too much current.
    brand: deriy
    specs:
      kwh: 14.3
      cells: 16S
      nominal_v: 51.2
      ah: 280
      chem: LiFePO4, EVE cells
      bms: JK inverter BMS
      bms_a: 200
      comms: CAN to the Growatt over RJ45
    note: The Growatt reads state of charge and charge limits from the BMS, so no separate battery monitor is needed.
    links:
      read:
        - title: "How I built a lithium battery bank"
          url: https://blog.openculture.org.ng/how-to-build-a-lithium-battery-bank-diy-from-nigeria/
        - title: "Optimal charge settings for LiFePO4"
          url: https://blog.openculture.org.ng/optimal-charge-settings-for-lithium-iron-phosphates-lifepo4/
      buy:
        - name: Deriy Energy
          url: https://www.deriyenergy.com/
      alternatives:
        - name: "Deye SE-F16, 51.2 V 314 Ah, 16 kWh, at Fouani"
          url: https://fouanistore.com/nigeria-en/product/1052?deye-low-voltage-se-f16-battery-16-kwh-display-screen-version
          note: "Slightly more expensive, but a good premium option: 230 A continuous and more than 6,000 cycles. Deye lists Growatt inverters as compatible over CAN, but check the SPF 6000 ES Plus with the seller."
        - name: "Growatt HOPE 16.0LM-A1, 51.2 V, 16 kWh, at Fouani"
          url: https://fouanistore.com/nigeria-en/product/1180?growatt-low-voltage-lifepo4-battery-16kwh-hope-16-0lm-a1
          note: "Slightly more expensive, but a good premium option: 15.3 kWh usable, 200 A discharge and 6,000 cycles. It’s Growatt’s own battery; check with the seller that it suits the SPF 6000 ES Plus."

  chint-nxu-ii-275:
    name: Chint NXU-II Type 2 SPD, 2P, 40 kA, 275 V
    icon: spd
    about: Surge protector. Diverts voltage spikes from lightning or switching to earth before they reach the equipment.
    brand: chint
    why: "A Type 2 surge protector built to IEC/EN 61643-11, the standard for surge protectors on low-voltage AC supplies. CE and RoHS marked."
    specs:
      spd_type: Type 2
      poles: 2
      imax: 40 kA
      uc_v: 275
    advice: The local Chint dealer didn’t stock the 275 V version, so this one came from AliExpress.
    links:
      buy:
        - name: AliExpress
          url: https://s.click.aliexpress.com/e/_c3GayHMx
          affiliate: true

  grid-board:
    name: "Grid board: Chint MCB, SPD, MCB"
    icon: db
    about: Grid distribution board. Takes the utility supply through breakers and surge protection, then feeds the Growatt’s AC input.
    brand: chint
    why: "Chint breakers are built to IEC/EN 60898-1, the standard for breakers in homes and similar buildings. The surge protector is the NXU-II, built to IEC/EN 61643-11."
    specs:
      phase: Single phase
      meter: Utility kWh meter
      main_a: null
      spd: Chint NXU-II, 275 V
    note: The grid only charges the battery and bypasses to the house when solar and battery run short. There’s no CT and no export.
    advice: Buy Chint breakers and RCBOs from an authorised Chint dealer in Nigeria.

  ac-board-light:
    name: "Light-load board: Chint MCB, SPD, RCBO"
    icon: db
    about: Distribution board. Breakers, surge protection and an RCBO, which cuts power on overload or earth leakage to protect people from shock.
    brand: chint
    why: "Chint breakers are built to IEC/EN 60898-1 and its RCBOs to IEC/EN 61009-1, the standards for breakers and RCBOs in homes and similar buildings. The surge protector is the NXU-II, built to IEC/EN 61643-11."
    specs:
      mcb_a: null
      spd: Chint NXU-II, 275 V
      rcbo: null
    advice: Buy Chint breakers and RCBOs from an authorised Chint dealer in Nigeria.

  ac-board-heavy:
    name: "Heavy-load board: Chint MCB, SPD, RCBO"
    icon: db
    about: Distribution board. Breakers, surge protection and an RCBO, which cuts power on overload or earth leakage to protect people from shock.
    brand: chint
    why: "Chint breakers are built to IEC/EN 60898-1 and its RCBOs to IEC/EN 61009-1, the standards for breakers and RCBOs in homes and similar buildings. The surge protector is the NXU-II, built to IEC/EN 61643-11."
    specs:
      mcb_a: null
      spd: Chint NXU-II, 275 V
      rcbo: null
    advice: Buy Chint breakers and RCBOs from an authorised Chint dealer in Nigeria.
