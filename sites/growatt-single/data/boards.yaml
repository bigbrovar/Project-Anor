# The AC boards. Each id (like grid-board) is also the page address of its
# wiring view: index.html#grid-board
#
#   part     the board's part id in build.yaml
#   line     grid (supply side) or load (inverter output side); sets the wire colour
#   feed     where the supply comes from, on one or two short lines
#   chain    the devices on the rail, in the order the supply passes through them:
#            mcb, rcbo, spd (tapped off the run, earthed) or run (a cable run)
#   outputs  breakers side by side at the end, each with what it feeds (to)
#   to       what the last device in the chain feeds, when there are no outputs
#   steps    "How it's wired", one line per step (<b> for bold)

grid-board:
  title: Grid board
  part: gridbd
  line: grid
  lead: Where the utility supply is switched and protected before it reaches the Growatt’s AC input.
  feed: [From the, kWh meter]
  chain:
    - {type: mcb, label: Main breaker, sub: 2P}
    - {type: spd, label: Chint NXU-II, sub: "Type 2 SPD, 275 V"}
    - {type: mcb, label: Breaker, sub: 2P}
  to: Growatt AC input
  steps:
    - Live and neutral come from the meter into the <b>top</b> of the 2-pole main breaker.
    - From its <b>bottom</b> terminals they loop up and along the rail. The <b>surge protector</b> taps both, and its bottom terminal goes to earth.
    - The loop ends in the <b>top</b> of the second 2-pole breaker, whose bottom terminals feed the Growatt’s AC input.

light-board:
  title: Light-load board
  part: acb-light
  line: load
  lead: The Growatt’s AC output, switched and protected before it reaches the light circuits.
  feed: [From the Growatt, AC output]
  chain:
    - {type: mcb, label: Breaker, sub: 2P}
    - {type: spd, label: Chint NXU-II, sub: "Type 2 SPD, 275 V"}
    - {type: rcbo, label: RCBO, sub: "2P, 30 mA"}
  to: Light loads
  steps:
    - Live and neutral come from the inverter into the <b>top</b> of the 2-pole breaker.
    - From the breaker’s <b>bottom</b> terminals they loop up and along the rail. The <b>surge protector</b> taps both, and its bottom terminal goes to earth.
    - The loop ends in the <b>top</b> of the <b>RCBO</b>, which trips on overload or on 30 mA of earth leakage.
    - The RCBO’s bottom terminals feed the circuits.

heavy-board:
  title: Heavy-load board
  part: acb-heavy
  line: load
  lead: The same Growatt AC output, on its own board for the heavy circuits.
  feed: [From the Growatt, AC output]
  chain:
    - {type: mcb, label: Breaker, sub: 2P}
    - {type: spd, label: Chint NXU-II, sub: "Type 2 SPD, 275 V"}
    - {type: rcbo, label: RCBO, sub: "2P, 30 mA"}
  to: Heavy loads
  steps:
    - Live and neutral come from the inverter into the <b>top</b> of the 2-pole breaker.
    - From the breaker’s <b>bottom</b> terminals they loop up and along the rail. The <b>surge protector</b> taps both, and its bottom terminal goes to earth.
    - The loop ends in the <b>top</b> of the <b>RCBO</b>, which trips on overload or on 30 mA of earth leakage.
    - The RCBO’s bottom terminals feed the circuits.
