# The battery page (index.html#battery): how the four packs are wired to the
# busbar, the cables, the measured balance and the JK BMS settings.

title: Battery
lead: One Deriy 14.3 kWh LiFePO4 pack, wired to the busbar so a second pack can join later without rewiring the inverter side.

packs: [1]

runs:
  - {pack: 1, pole: "+", size: 50 mm², length: 3.5 m}
  - {pack: 1, pole: "-", size: 50 mm², length: 3.5 m}
runs_note: Both runs are the same length.

steps:
  - The pack’s <b>+</b> runs to the <b>+ busbar</b> and its <b>−</b> to the <b>− bar</b>, on equal-length 50 mm² cable.
  - The Growatt’s battery cable lands on the same bars through its 250 A breaker. There’s no shunt; the Growatt reads state of charge from the JK BMS.
  - A second pack joins with + from one pack and − from the other, as on the two-pack Deye design.

busbar:
  title: Home-built busbar
  text: Two copper bars in an enclosure, with room for a second pack.

bms:
  name: JK inverter BMS
  role:
    - Talks CAN to the Growatt over RJ45, so the inverter charges and discharges to the BMS limits.
    - State of charge on the Growatt screen and Wi-Fi logger comes from the BMS.
  # Per-cell voltages. The page also shows each one for the 16-cell pack.
  cells_in_series: 16
  volts:
    - {label: Balancing starts at, cell_v: 3.40}
    - {label: Overvoltage protection (OVP), cell_v: 3.60}
    - {label: OVP recovery (OVPR), cell_v: 3.40}
    - {label: Charge voltage (RCV), cell_v: 3.45}
    - {label: Float voltage (RFV), cell_v: 3.35}
    - {label: 100% state of charge at, cell_v: 3.49}
  currents:
    - {label: Continuous charge current, a: 88}
    - {label: Continuous discharge current, a: 100}
