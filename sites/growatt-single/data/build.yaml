modes:
  day:
    caption: <b>Sunny day.</b> The two strings feed the Growatt’s trackers. It runs the house and charges the battery.
    flowing: [w-pva, w-pvb, w-boxa, w-boxb, w-dc, w-brk, w-batp, w-batn, w-out, w-light, w-heavyin, w-heavy]
    reversed: []
  night:
    caption: <b>Night, grid off.</b> No solar. The Growatt runs the house from the 14.7 kWh pack until it reaches the back-to-grid level.
    flowing: [w-dc, w-brk, w-batp, w-batn, w-out, w-light, w-heavyin, w-heavy]
    reversed: [w-dc, w-brk, w-batp, w-batn]
