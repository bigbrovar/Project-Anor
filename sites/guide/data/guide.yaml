# cont_w is what a system should carry at once: 80% of the inverter's rated power in kW,
# which leaves room for heat. An inverter rated in kVA is first converted at 0.8 kW per kVA.
# idle_w is the inverter's own use, added to the daily energy. The SRNE datasheet gives 50 W.
# Growatt and Deye don't publish a figure, so 50 W per inverter is an allowance for them.
# battery_kwh and pv_kwp are the design's battery and panel sizes. The planner checks them
# against what the reader needs. A pending design without them uses kwh_day, a flat daily limit.
#
# A kit is a power station (inverter, battery and solar charger in one box) with one panel.
# Its card under "Reference prices" also carries the `kit` notes: how it goes together and its limits.
# For a kit, pv_kwp is the most the unit accepts from the panel, not the panel's rating, and
# idle_w is an allowance (EcoFlow publishes no figure). allowance_pct and allowance_text
# replace the page-wide allowance, since a kit has no breakers or boards to buy.
# Solar limits (60 V, 15 A, 500 W on both units) are from EcoFlow's user manuals.
systems:
  - id: tiny
    name: Tiny
    tag: Plug-in kit
    state: kit
    url: https://tiny.anor.openculture.org.ng
    sys: "500 W · 0.96 kWh · one 650 W panel"
    good: "Lights, a fan, a TV, a laptop and phones."
    cont_w: 400
    idle_w: 15
    surge_w: 1000
    battery_kwh: 0.96
    pv_kwp: 0.5
    max_ac: 0
    allowance_pct: 10
    allowance_text: "The solar charging cable (MC4 to XT60i, sold separately), panel mounting and a short run of solar cable. An estimate, not a quoted price."
    parts:
      - {price: ecoflow-d3-1000air, qty: 1}
      - {price: jinko-650, qty: 1}
    kit:
      manual: https://ng.ecoflow.com/products/ecoflow-delta-3-air-1000-portable-power-station
      notes:
        - "How it goes together: the panel's two leads plug into an MC4 to XT60i solar cable, and that cable plugs into the unit's solar port. Appliances plug into the unit's sockets. There is nothing else to wire."
        - "The unit accepts up to 60 V, 15 A and 500 W from solar. One Jinko 650 W reaches about 52 V on a 10 °C morning, so it fits. The unit takes at most 500 W and leaves the rest."
        - "Use one panel only. Two in series would go past 60 V and damage the unit."
        - "It will not run a fridge through the night. The battery is under 1 kWh."
  - id: small
