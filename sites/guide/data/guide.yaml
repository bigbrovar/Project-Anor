# The author's own install: documented as built, not one of the recommendations.
reference:
  name: Project Anor, my home build
  url: https://home.anor.openculture.org.ng
  sys: "48 V · Victron · 16 kVA · 57.3 kWh · 18.3 kWp"
  # A blank line starts a new paragraph.
  text: |-
    2026 marks ten years of using solar as an alternative source of electricity, and in all that time people have constantly asked how to build a setup like mine. I set out to open-source my current install, but I realized it carries years of organic growth and technical debt that make little sense for a fresh build. Instead, I created clean-sheet designs that deliver the same reliability at different scales: from a full-house equivalent of my own setup down to smaller systems for people just getting started.

    The name Anor comes from The Lord of the Rings. It means the sun in Elvish.

