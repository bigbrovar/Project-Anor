# What the allowance covers, added to each total as a percentage of the parts above.
allowance_pct: 15
allowance_text: Breakers, the solar combiner box, surge protectors, battery connection bars, distribution boards, cable and panel mounting. An estimate, not a quoted price.

# ---------------------------------------------------------------------------
# The planner's settings: where the reader is, what they pay, and when they
# use their power. These decide the battery and panel sizes the reader needs,
# and so which design is picked.
planner:
  # What the page starts with.
  defaults:
    state: "FCT, Abuja"
    price: 209.5        # naira per kWh
    when: even          # one of the ids under `when`

  # The sizing rules, shown to the reader in the "solar that covers it" table.
  rules:
    inverter_load: 0.8  # an inverter runs at 80% of its rating or less (cont_w below already allows for this)
    battery_use: 0.8    # a lithium battery goes down to 20% and no lower
    battery_loss: 0.03  # share lost putting energy into the battery and taking it out
    panel_losses: 0.75  # what is left after heat, dust, cable and inverter losses
    own_surge: 3        # start-up surge of a typed-in appliance with a motor, as a multiple of its watts
    days_in_month: 30

  # Quick-pick prices, in naira per kWh.
  # Home (non-MD) rates for Abuja Electric, from NERC order ORDER/NERC/2025/059,
  # effective 1 July 2025: https://nerc.gov.ng/wp-content/uploads/2025/08/AEDC_July_2025_059.pdf
  bands:
    - {name: Band A, price: 209.5}
    - {name: B, price: 63.35}
    - {name: C, price: 51.79}
    - {name: D, price: 33.95}
  band_note: Band prices are Abuja Electric home rates from NERC's July 2025 tariff order. Other DisCos differ a little, so check your bill.

  # `night` is the share of a day's energy used after sunset.
  when:
    - {id: day, label: Mostly daytime, night: 0.3}
    - {id: even, label: "About even, day and night", night: 0.5}
    - {id: night, label: Mostly at night, night: 0.7}

  # Good sun hours a day for each state (yearly average, kWh per square metre a day).
  # PROVISIONAL: estimates by region that still need replacing with figures from a
  # published source. Update `sun_note` when that is done.
  sun_note: "Yearly average for {state}. Provisional figure. Change it if you know yours."
  states:
