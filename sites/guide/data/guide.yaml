# The Project Anor guide (project.anor.openculture.org.ng): the planner that
# points visitors to the dashboard that fits their loads and budget.
#
#   prices      reference prices, each with the sources it came from
#   systems     the designs, smallest first. state is live, pending (dashboard
#               not published yet) or scope (too big for this guide)
#   appliances  the planner tiles
#
# The limits are deliberately conservative. max_ac is the most air conditioners
# a system should have fitted, ac_at_once how many of them may run together
# (default: all of them) and max_ac_2hp how many may be as big as 2 HP
# (default: none). No system here takes more than five.

updated: 2026-11-10   # shown in the footer; also the date the prices were checked

# Reference prices in naira, from public listings. `price` is the figure the
# totals use; `range` is shown beside it when the sources differ.
