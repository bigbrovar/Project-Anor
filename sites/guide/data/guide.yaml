# Paid 1:1 sessions, offered only where the guide has no design: on the out-of-scope
# card and in the out-of-scope result. Leave url empty to hide both.
consult:
  url: https://calendar.app.google/V7tEH4MKXfbbSs4e9
  label: Book a 1:1
  card: "Custom build: talk it through 1:1"
  tip: "Above that, or for three-phase, <a>book a 1:1 session</a> with bigbrovar to plan a custom build. An installer can also quote one."

# The author's own install: documented as built, not one of the recommendations.
reference:
  name: The home build
  url: https://home.anor.openculture.org.ng
  sys: "48 V · Victron · 16 kVA · 58.8 kWh · 18.3 kWp"
  text: "I have run my home on solar for ten years, and people constantly ask how to build a setup like mine. Project Anor started as an attempt to open-source my current install, but I realized my system carries years of organic growth and technical debt that make little sense for a fresh build. Instead, I created clean-sheet designs that deliver the same reliability at different scales: from a full-house equivalent of my own setup down to smaller starter systems. That drive led me down the rabbit hole that led to this page."

# Posts on blog.openculture.org.ng for readers who want more on a topic.
# The energy audit post, linked beside the appliance tiles. Leave empty to hide the line.
audit_url: "https://blog.openculture.org.ng/of-a-budget-solar-inverter-system-energy-audit/"

reading:
  - {title: "A budget solar inverter system: energy audit", url: "https://blog.openculture.org.ng/of-a-budget-solar-inverter-system-energy-audit/", text: How to add up what your home really uses before you size anything.}
  - {title: "Building an off-grid solar system: my approach", url: "https://blog.openculture.org.ng/solar-plan/", text: The thinking behind the home build.}
  - {title: "A budget solar inverter system: solar panels", url: "https://blog.openculture.org.ng/of-a-budget-off-grid-solar/", text: Choosing and sizing panels.}
  - {title: "How I built a lithium battery bank", url: "https://blog.openculture.org.ng/how-to-build-a-lithium-battery-bank-diy-from-nigeria/", text: "Cells, BMS and assembly, from Nigeria."}
  - {title: "Optimal charge settings for LiFePO4", url: "https://blog.openculture.org.ng/optimal-charge-settings-for-lithium-iron-phosphates-lifepo4/", text: The charge and float voltages the dashboards use.}

# Planner tiles. watts is the running draw; surge_w the start-up draw of motors
# and compressors; hours and qty are the starting values. kwh_day replaces
# hours for things that cycle on and off. selected ticks it to start with. needs is the smallest system (by id)
# that should run it, with `why` shown when it pushes the pick up.
appliances:
  - {group: Everyday, id: bulb, icon: lightbulb, name: LED bulbs, watts: 10, hours: 6, qty: 8, selected: true}
  - {group: Everyday, id: fan, icon: fan, name: Ceiling fan, watts: 75, hours: 10, qty: 3, selected: true}
  - {group: Everyday, id: tv, icon: tv, name: "TV, 43 inch", watts: 80, hours: 6, qty: 1, selected: true}
  - {group: Everyday, id: dec, icon: router, name: Decoder and router, watts: 30, hours: 12, qty: 1, selected: true}
  - {group: Everyday, id: lap, icon: laptop, name: Laptop, watts: 65, hours: 8, qty: 1, selected: true}
  - {group: Everyday, id: phone, icon: smartphone, name: Phone charging, watts: 10, hours: 3, qty: 3, selected: true}
  - {group: Kitchen, id: fridge, icon: refrigerator, name: Fridge, watts: 150, surge_w: 600, kwh_day: 1.2, qty: 1, selected: true}
  - {group: Kitchen, id: freezer, icon: snowflake, name: Chest freezer, watts: 120, surge_w: 500, kwh_day: 1.0, qty: 1}
  - {group: Kitchen, id: micro, icon: microwave, name: Microwave, watts: 1200, hours: 0.5, qty: 1, needs: msmall, why: A microwave draws more than a 12 V starter should carry.}
  - {group: Kitchen, id: blend, icon: blend, name: Blender, watts: 400, surge_w: 800, hours: 0.5, qty: 1}
  - {group: Kitchen, id: cooker, icon: zap, name: Induction cooker, watts: 2000, hours: 1, qty: 1, needs: medium, why: Cooking needs a 48 V system. On 24 V it would drain the battery and strain the inverter.}
  - {group: Kitchen, id: oven, icon: microwave, name: Electric oven, watts: 2500, hours: 0.5, qty: 1, needs: large, why: An oven only fits on backup with the two-Deye design. On the smaller ones it stays on the grid.}
  - {group: Heavy loads, id: iron, icon: shirt, name: Pressing iron, watts: 1000, hours: 0.5, qty: 1, needs: medium, why: Heating elements stay on the grid on the 24 V system.}
  - {group: Heavy loads, id: wash, icon: washing-machine, name: Washing machine, watts: 500, surge_w: 1200, hours: 1, qty: 1, needs: msmall, why: A washing machine’s motor is too much for a 12 V starter.}
  - {group: Heavy loads, id: pump, icon: droplets, name: "Pumping machine, 1 HP", watts: 750, surge_w: 2250, hours: 1, qty: 1, needs: medium, why: A 1 HP pump’s start-up surge needs a 48 V system.}
  - {group: Heavy loads, id: ac1, icon: air-vent, name: "AC, 1 HP inverter", watts: 900, surge_w: 2700, hours: 6, qty: 1, ac: true, needs: medium, why: Air conditioners need a 48 V system. Hours of running would empty a 12 V or 24 V battery long before morning.}
  - {group: Heavy loads, id: ac15, icon: air-vent, name: "AC, 1.5 HP inverter", watts: 1100, surge_w: 3300, hours: 6, qty: 1, ac: true, needs: medium, why: Air conditioners need a 48 V system. Hours of running would empty a 12 V or 24 V battery long before morning.}
  - {group: Heavy loads, id: ac2, icon: air-vent, name: "AC, 2 HP inverter", watts: 1500, surge_w: 4500, hours: 6, qty: 1, ac: true, ac_2hp: true, needs: large, why: A 2 HP air conditioner only fits the two-Deye design, and no more than two of them.}
  - {group: Heavy loads, id: heater, icon: droplets, name: Water heater, watts: 2000, hours: 1.5, qty: 1, needs: large, why: A water heater only fits on backup with the two-Deye design. On the smaller ones it stays on the grid.}
