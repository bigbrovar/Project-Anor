# What's inside each PV box. Each id (like pv-box-1) is also the page address
# of its wiring view: index.html#pv-box-1
#
#   part               the box's part id in build.yaml
#   kind               pair = one separate channel per array (one or more)
#   arrays             the panel arrays (from build.yaml) that feed this box
#   string_protection  the fuse or breaker on each string, as a product id.
#                      The sizing checks test its rating.
#   surge_protector    the DC surge protector, as a product id with an spd_v spec
#   inside             the parts listed under "In this box"
#   steps              "How it's wired", one line per step (<b> for bold)

pv-box-1:
  title: PV box 1
  short: Deye 1
  part: box-1
  kind: pair
  arrays: [pv-1, pv-2, pv-3]
  string_protection: feeo-fuse-23
  surge_protector: feeo-spd-600
  lead: Three separate channels for Deye 1, built from the same Feeo parts as the home system. Each string gets its own fuses, breaker and surge protector, then runs to its own tracker.
  channels:
    - {array: pv-1, to: Deye 1 · MPPT 1}
    - {array: pv-2, to: Deye 1 · MPPT 2}
    - {array: pv-3, to: Deye 1 · MPPT 3}
  inside:
    - {product: feeo-fuse-23, qty: 6, where: + and − of each string}
    - {product: feeo-mcb-2p, qty: 3, where: "one per string, both poles"}
    - {product: feeo-spd-600, qty: 3, where: "one per string, across + and −"}
  steps:
    - Each string’s <b>+ and −</b> go through their own 23 A fuse.
    - The fused pair goes into a <b>2-pole breaker</b>, so one switch isolates the string.
    - A <b>600 V Feeo surge protector</b> sits across + and −, with its earth to the local earth reference.
    - Each channel leaves the box to its own <b>Deye 1 MPPT</b>.

pv-box-2:
  title: PV box 2
  short: Deye 2
  part: box-2
  kind: pair
  arrays: [pv-4, pv-5, pv-6]
  string_protection: feeo-fuse-23
  surge_protector: feeo-spd-600
  lead: The same three-channel box for Deye 2.
  channels:
    - {array: pv-4, to: Deye 2 · MPPT 1}
    - {array: pv-5, to: Deye 2 · MPPT 2}
    - {array: pv-6, to: Deye 2 · MPPT 3}
  inside:
    - {product: feeo-fuse-23, qty: 6, where: + and − of each string}
    - {product: feeo-mcb-2p, qty: 3, where: "one per string, both poles"}
    - {product: feeo-spd-600, qty: 3, where: "one per string, across + and −"}
  steps:
    - Each string’s <b>+ and −</b> go through their own 23 A fuse.
    - The fused pair goes into a <b>2-pole breaker</b>, so one switch isolates the string.
    - A <b>600 V Feeo surge protector</b> sits across + and −, with its earth to the local earth reference.
    - Each channel leaves the box to its own <b>Deye 2 MPPT</b>.
