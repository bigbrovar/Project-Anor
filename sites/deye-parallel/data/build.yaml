other_blocks:
  grid:
    title: Grid supply
    icon: meter
    category: grid
    about: Single-phase utility supply through the kWh meter. Feeds both Deye grid ports only; every load sits behind the Deyes.
    rows:
      - [Supply, Single phase]
      - [Feeds, Both Deye grid ports]
  light:
    title: Light loads
    icon: home
    category: load
    about: "On the joined Deye LOAD outputs, so they stay on in an outage: TV, refrigerator, ceiling fans, lights, network switch, routers, power tools, blender and laptops."
