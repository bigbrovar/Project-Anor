      - [Grid off, "On above 90% battery with sun, off at 40%"]

modes:
  day:
    caption: <b>Sunny day.</b> Six strings feed the two Deyes’ trackers. Together they run the light loads, charge the shared bank and, once it’s above the smart-load level, run the heavy loads on the GEN ports.
    flowing: [w-pv1, w-pv2, w-pv3, w-pv4, w-pv5, w-pv6, w-b1a, w-b1b, w-b1c, w-b2a, w-b2b, w-b2c, w-dc1, w-dc2, w-brk1, w-brk2, w-batp, w-batn, w-load1, w-load2, w-light, w-gen1, w-gen2, w-heavy]
    reversed: []
  night:
    caption: <b>Night, grid off.</b> No solar. Both Deyes draw from the 58.8 kWh bank. The heavy loads stay on until the battery reaches the smart-load off level, then go off to save the rest for the light loads.
    flowing: [w-dc1, w-dc2, w-brk1, w-brk2, w-batp, w-batn, w-load1, w-load2, w-light, w-gen1, w-gen2, w-heavy]
    reversed: [w-dc1, w-dc2, w-brk1, w-brk2, w-batp, w-batn]
  grid:
    caption: <b>Grid on.</b> Grid passes through both Deyes to the light and heavy loads and can recharge the bank, depending on their settings.
    flowing: [w-grid, w-grid1, w-grid2, w-load1, w-load2, w-light, w-gen1, w-gen2, w-heavy, w-dc1, w-dc2, w-brk1, w-brk2, w-batp, w-batn]
    reversed: []

