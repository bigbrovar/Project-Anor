# This design: the parts used and how many, how the panel strings are wired,
# the Sunny day / Night / Grid on views, the page text and the settings for the
# battery-side checks. Products are described in products.yaml; positions on
# the drawing live in layout.yaml.

version: "0.1"
updated: 2026-11-09   # shown in the footer, with the version

# Text at the top of the page and in the "Why this design" section.
# Text fields can use <b> for bold.
page:
  title: Project Anor · two Deye 8 kW, the Victron replacement
  description: The direct alternative to the Project Anor Victron system, rebuilt around two Deye SUN-8K hybrid inverters in parallel with 36 Jinko panels on their built-in MPPTs and the same four battery packs.
  brand: alternative design
  eyebrow: Victron replacement · 48 V · two Deye 8 kW in parallel
  h1: Project Anor on two Deyes
  lead: The direct alternative to today’s Victron setup. Two Deye 8 kW hybrid inverters work as one on the same four-pack battery bank. 36 Jinko 590 W panels feed their six built-in solar trackers, so the separate chargers, their combiner boxes and the battery monitor all go. Light loads run on the joined backup outputs; heavy loads run on the GEN ports as a smart load.
  inverters_label: Two in parallel
  glance:
    - {icon: mppt, cat: solar, title: Six trackers, one panel model, text: "36 Jinko 590 W panels in six strings of 6, one string per built-in Deye tracker, at up to about 330 V. No separate solar chargers."}
    - {icon: battery, cat: batt, title: The same battery bank, text: "The four Deriy 14.7 kWh packs stay on the same busbar. Each Deye has its own 250 A breaker. The JK BMS talks CAN to the master Deye, which shares the limits with the second unit."}
    - {icon: home, cat: load, title: 16 kW shared, two outputs, text: "The joined LOAD outputs carry the light loads. The GEN ports, set as a smart load, carry the heavy loads within about 13 kW and switch them off before the battery runs low."}
  budget:
    title: About 13 kW for heavy loads
    lead: "The two Deyes share 16 kW. Allow about 1.5 kW for the light loads and a margin for motor start-up, and roughly 13 kW is left for the GEN ports. The hours are a typical day; wattages are typical figures, so check your own appliances’ labels."
    budget_w: 13000
    light_kwh: 8
    sun_hours: 4
    derate: 0.7
    rows:
      - {load: "Air conditioner, 1.5 HP inverter type", watts: 1100, qty: 5, hours: 6, note: All five can run together.}
      - {load: "Deep-well pump, 1 HP", watts: 750, qty: 1, hours: 2}
      - {load: Induction cooker, watts: 2000, qty: 1, hours: 1.5}
      - {load: Electric oven, watts: 2500, qty: 1, hours: 0.5}
      - {load: Water heater, watts: 2000, qty: 1, hours: 1.5, note: "One at a time; three at once would pass the budget.", status: part}
    settings:
      - "Both GEN ports set to <b>Smart load output</b>, with the same settings on master and slave."
      - "<b>On grid always on</b>: heavy loads run whenever the grid is up."
      - "Without grid: <b>on at 90%</b> battery with at least 2 kW of solar, <b>off at 40%</b>, keeping the rest of the 58.8 kWh for the light loads."
      - "Deye’s manual doesn’t say whether smart load works in a parallel system. Confirm it with Deye or your installer for your firmware. If it doesn’t, give each Deye’s GEN port its own heavy circuits."
  upgrades:
    - "<b>Two Deye 12K units</b> in place of the 8Ks: 24 kW, so every heavy load fits at once, and room for up to 38.4 kW of PV."
    - "<b>A third Deye</b> in parallel: same wiring, another 8 kW and three more trackers."
    - "<b>More battery</b>: extra packs join the same busbar."
  notes:
    title: Why this design
    lead: The current install grew one piece at a time and carries technical debt. This page sketches what it would look like if it were built in one go today, keeping all the loads on backup.
    items:
      - {h: What goes, text: "The Multi RS Solar, both SmartSolar chargers, Combiners C and D, the SmartShunt, the DIY GX and the MultiPlus-II. Two Deyes do the work of all of them."}
      - {h: Why, text: "Too many low-voltage panel strings needed their own chargers and combiner boxes, and Victron gear costs a lot per kW. Two hybrid inverters with high-voltage trackers are simpler, cheaper and easier to service."}
      - {h: The trade-off, text: "<b>Same size, different control.</b> 16 kW across two units, close to today’s 16 kVA. Heavy loads now switch off at a set battery level in an outage, instead of draining the bank."}
      - {h: Panels, text: "Standardised on the Jinko Tiger Neo 590 W. 36 panels (21.2 kWp), 10.6 kWp per Deye, inside each unit’s 12.8 kW PV limit. That’s five more than today’s 31 mixed panels."}
      - {h: How parallel works, text: "One Deye is set as master and the other as slave. A parallel cable joins their communication ports, so they share load, charging and the grid connection as one system. Their load outputs are wired together."}
    alt_title: Bigger options in the same family
    alternatives:
      - {name: "Deye SUN-12K-SG06LP1-EU-CM3, 12 kW single phase", url: "https://deye.com/product/sun-7-12k-sg06lp1-eu-cm3/", text: "Same body, battery and wiring. One 12 kW unit carries most of what two 8 kW units do, with 250 A battery current and up to 19.2 kW of PV. Two in parallel give 24 kW."}
      - {name: "Deye SUN-12K-SG04LP3-EU, 12 kW three phase", url: "https://deye.com/product/sun-5-6-8-10-12k-sg04lp3-5-12kw-three-phase-2-mppt-hybrid-inverter-low-voltage-battery/", text: "For a three-phase supply. Same 48 V battery, 2 MPPTs, and it parallels the same way."}
  footer: "Links marked Affiliate are AliExpress affiliate links: if you buy through them, Openculture earns a small commission at no extra cost to you. The Deye, ZJBeny and Deriy links are not affiliate links."

